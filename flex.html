<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        *::after,
        *::before,*{
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: blue;

        }

        div{
            width:400px;
            height: 500px;
            background-color: aliceblue;
            border-radius: 10px;

        }

        .card img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;

        }

        .card h2 {
            text-align: start;
            font-size: 30px;
            color:black;
            margin:auto;
            padding: 0px 15px;
        }

        .card footer {
            justify-content: space-between;
            
        }
    </style>

</head>
<body>
    <section id="container">
        <div class="card">
            <img src="photo/image.jpg" alt="London Bridge">
            <h2>London Bridge</h2>
            <p>Beautiful view of London Bridge</p>
        </div>

    </section>

    </section>
</body>
</html>
